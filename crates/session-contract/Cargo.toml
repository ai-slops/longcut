[package]
name = "longcut-session-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
longcut-timebase = { path = "../timebase" }
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
