[package]
name = "longcut-timebase"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.clippy]
all = "deny"
pedantic = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
trivially_copy_pass_by_ref = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
